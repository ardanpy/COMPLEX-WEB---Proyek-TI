    <div class="dashboard-main">
      <header class="topbar" role="banner">
        <div class="topbar-search">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />

            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>

          <input
            type="search"
            class="topbar-search-input"
            placeholder="Mau cari fitur apa?"
            id="searchInput"
            aria-label="Cari fitur"
          />
        </div>

        <div class="topbar-actions">
          <button
            class="topbar-action-btn"
            id="btnMsg"
            aria-label="Pesan"
            onclick="showPlaceholder('Pesan')"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="4" width="20" height="16" rx="2" />

              <polyline points="2,4 12,13 22,4" />
            </svg>
          </button>

          <button
            class="topbar-action-btn"
            id="btnNotif"
            aria-label="Notifikasi"
            onclick="
              window.location.assign('notifikasi.html');
              return false;
            "
          >
            <span class="notif-dot"></span>

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />

              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
          </button>

          <button
            class="topbar-action-btn"
            id="btnSettings"
            aria-label="Pengaturan"
            onclick="showPlaceholder('Pengaturan')"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />

              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>

          <a
            href="profil.html"
            class="topbar-avatar"
            id="btnAvatar"
            aria-label="Buka profil pengguna"
          >
            <div class="avatar-circle">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />

                <circle cx="12" cy="7" r="4" />
              </svg>
            </div>

            <span class="topbar-username" id="topbarUsername">Pengguna</span>
          </a>
        </div>
      </header>

      <div class="notification-page">
        <main class="dashboard-content notification-content" role="main">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a class="breadcrumb-link" href="beranda.html">Beranda</a>

            <span class="breadcrumb-sep" aria-hidden="true">/</span>

            <span aria-current="page">Notifikasi</span>
          </nav>

          <section
            class="notification-heading-row"
            aria-labelledby="notificationPageTitle"
          >
            <h1 id="notificationPageTitle">Notifikasi</h1>

            <button
              class="notification-mark-all"
              id="btnMarkAllRead"
              type="button"
            >
              Tandai semua dibaca
            </button>
          </section>

          <div
            class="notification-tabs"
            role="tablist"
            aria-label="Kategori notifikasi"
          >
            <button
              class="notification-tab is-active"
              type="button"
              role="tab"
              id="tabPengumuman"
              aria-selected="true"
              aria-controls="notificationList"
              data-category="Pengumuman"
            >
              Pengumuman
            </button>

            <button
              class="notification-tab"
              type="button"
              role="tab"
              id="tabKomunitas"
              aria-selected="false"
              aria-controls="notificationList"
              data-category="Komunitas"
            >
              Komunitas
            </button>

            <button
              class="notification-tab"
              type="button"
              role="tab"
              id="tabSistem"
              aria-selected="false"
              aria-controls="notificationList"
              data-category="Sistem"
            >
              Sistem
            </button>
          </div>

          <section
            class="notification-list"
            id="notificationList"
            aria-label="Daftar notifikasi"
            aria-live="polite"
          >
            <div class="notification-loading">Memuat notifikasi...</div>
          </section>
        </main>

        <div
          id="notificationToast"
          class="notification-toast"
          role="status"
          aria-live="polite"
        ></div>
      </div>

      <!-- /.notification-page -->
    </div>

    <!-- /.dashboard-main -->

    <!-- Toast Notification -->

    <div
      id="toastNotif"
      class="toast-notif"
      role="alert"
      aria-live="polite"
    ></div>

    <!-- Modal Placeholder -->

    <div
      id="placeholderModal"
      class="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="placeholderTitle"
      style="display: none"
    >
      <div class="modal-box">
        <div class="modal-icon-wrap">
          <svg
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#0B2A5B"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />

            <line x1="12" y1="8" x2="12" y2="12" />

            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        </div>

        <h3 class="modal-title" id="placeholderTitle">Fitur Belum Tersedia</h3>

        <p class="modal-desc" id="placeholderDesc">
          Halaman ini akan dikembangkan pada tahap selanjutnya.
        </p>

        <button
          class="btn btn-primary"
          id="btnCloseModal"
          onclick="closePlaceholderModal()"
        >
          Mengerti
        </button>
      </div>
    </div>

    <script src="js/app.js"></script>

    <script src="js/navigation.js"></script>
