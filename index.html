<!doctype html>

<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>COMPLEX — Login | Satu aplikasi untuk warga komplek</title>

    <meta
      name="description"
      content="Masuk ke COMPLEX, aplikasi terpadu untuk warga kompleks perumahan. Kelola iuran, keamanan, fasilitas, dan lebih banyak lagi."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth-brand-photo.css" />
  </head>

  <body class="auth-body auth-login-page">
    <!-- ======================================================

       HALAMAN LOGIN

       Catatan: Halaman ini hanya frontend. Autentikasi belum

       terhubung ke backend atau database produksi.

  ======================================================= -->

    <div class="auth-container">
      <!-- Kolom Kiri: Branding -->

      <div class="auth-brand auth-brand-photo">
        <div class="brand-content">
          <div class="brand-logo">
            <img
              class="brand-logo-image"
              src="assets/complex-houselogo.png"
              alt="Simbol rumah COMPLEX"
              width="64"
              height="64"
            />
          </div>

          <h1 class="brand-name">
            <span class="brand-name-main">Comple</span
            ><span class="brand-name-accent">X</span>
          </h1>

          <p class="brand-tagline">Satu aplikasi untuk warga komplek</p>

          <div class="brand-features">
            <div class="brand-feature-item">
              <span class="brand-feature-icon">🏘️</span>

              <span>Komunitas perumahan</span>
            </div>

            <div class="brand-feature-item">
              <span class="brand-feature-icon">🛡️</span>

              <span>Keamanan terpadu</span>
            </div>

            <div class="brand-feature-item">
              <span class="brand-feature-icon">📋</span>

              <span>Laporan mudah</span>
            </div>

            <div class="brand-feature-item">
              <span class="brand-feature-icon">🔔</span>

              <span>Notifikasi real-time</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Kolom Kanan: Formulir Login -->

      <div class="auth-form-panel">
        <div class="auth-card">
          <div class="auth-card-header">
            <p class="auth-greeting">Hai, Selamat Datang 👋</p>

            <h2 class="auth-title">Login</h2>
          </div>

          <form id="loginForm" class="auth-form" novalidate>
            <!-- Data profil tambahan (opsional saat login) -->

            <div class="form-group" id="fg-nama">
              <label for="loginNama" class="form-label"
                >Nama Lengkap <span class="optional-mark">opsional</span></label
              >

              <input
                type="text"
                id="loginNama"
                name="namaLengkap"
                class="form-input"
                placeholder="Masukkan nama lengkap Anda"
                autocomplete="name"
              />

              <span class="form-error" id="err-nama"></span>
            </div>

            <!-- Nomor telepon tambahan (opsional saat login) -->

            <div class="form-group" id="fg-telp">
              <label for="loginTelp" class="form-label"
                >Nomor Telepon
                <span class="optional-mark">opsional</span></label
              >

              <input
                type="tel"
                id="loginTelp"
                name="nomorTelepon"
                class="form-input"
                placeholder="08xxxxxxxxxx"
                autocomplete="tel"
              />

              <span class="form-error" id="err-telp"></span>
            </div>

            <!-- Email (Wajib) -->

            <div class="form-group" id="fg-email">
              <label for="loginEmail" class="form-label">
                Email <span class="required-mark">*</span>
              </label>

              <input
                type="email"
                id="loginEmail"
                name="email"
                class="form-input"
                placeholder="Masukkan email Anda"
                autocomplete="email"
                required
              />

              <span class="form-error" id="err-email"></span>
            </div>

            <!-- Blok dan nomor rumah (opsional saat login) -->

            <div class="form-row-two">
              <div class="form-group form-group-flex" id="fg-blok">
                <label for="loginBlok" class="form-label"
                  >Blok <span class="optional-mark">opsional</span></label
                >

                <select
                  id="loginBlok"
                  name="blok"
                  class="form-input form-select"
                >
                  <option value="">-- Pilih Blok --</option>

                  <option value="Jati 1">Jati 1</option>

                  <option value="Jati 2">Jati 2</option>

                  <option value="Jati 3">Jati 3</option>

                  <option value="Jati 4">Jati 4</option>

                  <option value="Jati 5">Jati 5</option>

                  <option value="Jati 6">Jati 6</option>

                  <option value="Jati 7">Jati 7</option>
                </select>

                <span class="form-error" id="err-blok"></span>
              </div>

              <div class="form-group form-group-flex" id="fg-norumah">
                <label for="loginNoRumah" class="form-label"
                  >No. Rumah <span class="optional-mark">opsional</span></label
                >

                <input
                  type="text"
                  id="loginNoRumah"
                  name="noRumah"
                  class="form-input"
                  placeholder="Contoh: 52"
                  autocomplete="off"
                />

                <span class="form-error" id="err-norumah"></span>
              </div>
            </div>

            <!-- Password (Wajib) -->

            <div class="form-group" id="fg-pass">
              <label for="loginPassword" class="form-label">
                Password <span class="required-mark">*</span>
              </label>

              <div class="input-password-wrapper">
                <input
                  type="password"
                  id="loginPassword"
                  name="password"
                  class="form-input"
                  placeholder="Masukkan password Anda"
                  autocomplete="current-password"
                  required
                />

                <button
                  type="button"
                  class="toggle-password"
                  id="toggleLoginPass"
                  aria-label="Tampilkan/Sembunyikan password"
                >
                  <svg
                    id="eyeIconLogin"
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />

                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>

              <span class="form-error" id="err-pass"></span>
            </div>

            <!-- Remember + Lupa Password -->

            <div class="form-row-between">
              <label class="checkbox-label" for="rememberMe">
                <input type="checkbox" id="rememberMe" name="rememberMe" />

                <span class="checkmark"></span>

                <span class="checkbox-text">Remember for 30 days</span>
              </label>

              <button type="button" class="link-btn" id="btnLupaPassword">
                Lupa Password?
              </button>
            </div>

            <!-- Tombol Sign In -->

            <button
              type="submit"
              id="btnSignIn"
              class="btn btn-primary btn-block"
            >
              Sign In
            </button>
          </form>

          <!-- Divider -->

          <div class="auth-divider">
            <span>Masuk cepat menggunakan</span>
          </div>

          <!-- Masuk menggunakan Google -->

          <div class="social-buttons">
            <button
              type="button"
              class="btn btn-social"
              id="btnGoogle"
              aria-label="Masuk menggunakan akun Google"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="#4285F4"
                />

                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853"
                />

                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                  fill="#FBBC05"
                />

                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335"
                />
              </svg>

              Google
            </button>
          </div>

          <!-- Link ke Daftar -->

          <p class="auth-switch-text">
            Belum punya akun?

            <a href="daftar.html" class="link-accent" id="linkDaftar">Daftar</a>
          </p>

          <!-- Tombol SIGAP -->

          <div class="sigap-divider-line"></div>

          <button
            type="button"
            class="btn btn-sigap-login"
            id="btnSigapLogin"
            onclick="window.location.href = 'sigap.html'"
          >
            🚨 SIGAP
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->

    <div
      id="toastNotif"
      class="toast-notif"
      role="alert"
      aria-live="polite"
    ></div>

    <script src="js/app.js"></script>

    <script type="module" src="js/auth-login.js"></script>
  </body>
</html>
